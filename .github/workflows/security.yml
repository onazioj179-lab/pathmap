name: Security Hardening CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        # pip-audit (PyPA) needs no account/auth, unlike `safety` which now
        # requires a registered API key.
        run: pip install pip-audit

      - name: Scan Python dependencies (advisory)
        working-directory: ./backend
        # Advisory: surfaces vulnerabilities in the logs without blocking PRs.
        run: pip-audit -r requirements.txt || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit npm packages (advisory)
        working-directory: ./frontend
        run: npm audit --audit-level=moderate || true

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install CycloneDX
        run: |
          pip install cyclonedx-bom
          npm install -g @cyclonedx/cyclonedx-npm

      - name: Install frontend dependencies
        working-directory: ./frontend
        # cyclonedx-npm runs `npm ls`, which needs installed node_modules.
        run: npm ci

      - name: Generate Backend SBOM
        working-directory: ./backend
        run: cyclonedx-py requirements requirements.txt -o backend-sbom.xml

      - name: Generate Frontend SBOM
        working-directory: ./frontend
        run: cyclonedx-npm --output-file frontend-sbom.xml

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            backend/backend-sbom.xml
            frontend/frontend-sbom.xml
          retention-days: 90

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pathmap-backend:test ./backend

      - name: Build frontend image
        run: docker build -t pathmap-frontend:test ./frontend

      - name: Run Trivy scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pathmap-backend:test
          format: "sarif"
          output: "trivy-backend.sarif"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy scanner (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pathmap-frontend:test
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "CRITICAL,HIGH"

      # Each SARIF must be uploaded under a distinct category; GitHub no longer
      # accepts multiple runs combined in one upload.
      - name: Upload Trivy results (backend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy results (frontend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  security-headers:
    name: Test Security Headers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start test environment
        # Compose V2 is a docker plugin on modern runners ("docker compose",
        # not the removed "docker-compose" binary).
        run: docker compose up -d --build
        env:
          JWT_SECRET: test_secret_for_ci_only
          POSTGRES_PASSWORD: test_password
          # Production emits HSTS, but FORCE_HTTPS would 307-redirect the plain
          # HTTP probe below and hide the app headers, so disable it for the test.
          ENVIRONMENT: production
          FORCE_HTTPS: "false"

      - name: Wait for backend to be ready
        # The backend loads an OSM graph on startup, so poll instead of a fixed sleep.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/v1/health >/dev/null 2>&1; then
              echo "backend ready after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "backend did not become ready"; docker compose logs backend; exit 1

      - name: Test security headers
        run: |
          headers=$(curl -sI http://localhost:8000/v1/health)
          echo "$headers"
          echo "$headers" | grep -i "x-frame-options: DENY"
          echo "$headers" | grep -i "x-content-type-options: nosniff"
          echo "$headers" | grep -i "strict-transport-security"

      - name: Stop test environment
        if: always()
        run: docker compose down
