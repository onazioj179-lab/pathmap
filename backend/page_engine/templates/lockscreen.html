<div id="lockscreen" class="lockscreen-container">
    <style>
        .lockscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: lockscreen-fade-in 0.3s ease-in-out;
        }
        
        @keyframes lockscreen-fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .lockscreen-logo {
            font-size: 3rem;
            font-weight: 700;
            color: white;
            margin-bottom: 2rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .lockscreen-subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 3rem;
            text-align: center;
            padding: 0 2rem;
        }
        
        .passcode-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        
        .passcode-input {
            width: 280px;
            padding: 1rem;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            letter-spacing: 0.5rem;
            outline: none;
            transition: all 0.2s ease;
        }
        
        .passcode-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: normal;
        }
        
        .passcode-input:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        
        .unlock-button {
            width: 280px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #667eea;
            background: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .unlock-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .unlock-button:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            display: none;
            animation: shake 0.4s ease;
        }
        
        .error-message.show {
            display: block;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .lockscreen-hint {
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
        }
    </style>
    
    <div class="lockscreen-logo">PATHFINDER</div>
    <div class="lockscreen-subtitle">Ultra-Precision Navigation System<br>Version {{ version }}</div>
    
    <form class="passcode-form" id="passcode-form" onsubmit="return unlockScreen(event)">
        <input 
            type="password" 
            id="passcode-input"
            class="passcode-input"
            placeholder="Enter Passcode"
            maxlength="6"
            pattern="[0-9]*"
            inputmode="numeric"
            autocomplete="off"
            required
        />
        
        <button type="submit" class="unlock-button">
            Unlock
        </button>
        
        <div id="error-message" class="error-message">
            Incorrect passcode
        </div>
        
        <div class="lockscreen-hint">
            Default: 598011
        </div>
    </form>
    
    <script>
        function unlockScreen(event) {
            event.preventDefault();
            
            const passcodeInput = document.getElementById('passcode-input');
            const errorMessage = document.getElementById('error-message');
            const passcode = passcodeInput.value;
            
            // Send unlock request to PPE
            fetch('/api/v44/unlock', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ passcode })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Successful unlock
                    errorMessage.classList.remove('show');
                    
                    // Fade out lockscreen
                    document.getElementById('lockscreen').style.animation = 'lockscreen-fade-out 0.3s ease-in-out';
                    
                    setTimeout(() => {
                        // Update PPE state
                        window.PPE.state.lockscreen_active = false;
                        window.PPE.state.map_initialized = true;
                        
                        // Dispatch unlock event
                        window.dispatchEvent(new CustomEvent('ppe-unlock'));
                        
                        // Hide lockscreen, show main
                        document.getElementById('lockscreen-layer').style.display = 'none';
                        document.getElementById('main-layer').style.display = 'block';
                    }, 300);
                } else {
                    // Failed unlock
                    errorMessage.classList.add('show');
                    passcodeInput.value = '';
                    passcodeInput.focus();
                    
                    // Shake effect
                    passcodeInput.style.animation = 'none';
                    setTimeout(() => {
                        passcodeInput.style.animation = 'shake 0.4s ease';
                    }, 10);
                }
            })
            .catch(error => {
                console.error('[Lockscreen] Unlock error:', error);
                errorMessage.classList.add('show');
            });
            
            return false;
        }
        
        @keyframes lockscreen-fade-out {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
    </script>
</div>
