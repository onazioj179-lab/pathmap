<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport settings: allow user scaling for accessibility (WCAG) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="PathMap - AI-powered real-time location tracking with multi-GNSS satellite fusion"
    />
    <meta name="apple-mobile-web-app-title" content="PathMap" />
    <meta name="application-name" content="PathMap" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>PathMap</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Map styles -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://api.maptiler.com" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />

    <!-- Prevent iOS bounce -->
    <style>
      html,
      body {
        overscroll-behavior: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then(registration => {
              console.log('[App] Service Worker registered:', registration.scope);
            })
            .catch(error => {
              console.log('[App] Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
